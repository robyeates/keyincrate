name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-test-all:  
    runs-on: ubuntu-18.04
    needs: [build-mac, build-windows]
  
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Release
        uses: fnkr/github-action-ghr@v1
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GHR_PATH: builds/
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  build-mac:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Set up Go
      uses: actions/setup-go@v2
      with:
        go-version: 1.17

    - name: Build
      run: go build -v ./... -ldflags "-s -w" .

    - name: Test
      run: go test -v ./...
      
  build-windows:
    runs-on: windows-2019
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Go
      uses: actions/setup-go@v2
      with:
        go-version: 1.17

    - name: Build
      run: go build -v ./... -ldflags "-s -w -H=windowsgui -extldflags=-static -o builds/keyincrate.exe"

    - name: Test
      run: go test -v ./..
